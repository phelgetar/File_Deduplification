# ============================================================================
# File Type Groups Configuration
# ============================================================================
# Version: 1.0.0
# Created: 2025-11-15
#
# Defines groups of file types for selective scanning.
# Use with --file-types flag to scan only specific types.
#
# Examples:
#   --file-types images           # Scan only image files
#   --file-types media            # Scan all media (images, videos, audio)
#   --file-types docs             # Scan all document types
#   --file-types word_docs        # Scan only Word documents
# ============================================================================

file_type_groups:

  # ========================================================================
  # MEDIA (Top-level - all media types)
  # ========================================================================
  media:
    description: "All media files (images, videos, audio)"
    includes_groups:
      - images
      - videos
      - audio

  # ========================================================================
  # IMAGES
  # ========================================================================
  images:
    description: "All image file types"
    extensions:
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .bmp
      - .tiff
      - .tif
      - .webp
      - .heic
      - .heif
      - .raw
      - .cr2
      - .nef
      - .dng
      - .arw
      - .orf
      - .rw2
      - .svg
      - .ico
      - .psd
      - .ai
      - .eps

  photos:
    description: "Common photo formats (JPEG, PNG, HEIC)"
    extensions:
      - .jpg
      - .jpeg
      - .png
      - .heic
      - .heif

  raw_images:
    description: "RAW image formats from cameras"
    extensions:
      - .raw
      - .cr2
      - .nef
      - .dng
      - .arw
      - .orf
      - .rw2

  # ========================================================================
  # VIDEOS
  # ========================================================================
  videos:
    description: "All video file types"
    extensions:
      - .mp4
      - .mov
      - .avi
      - .mkv
      - .wmv
      - .flv
      - .webm
      - .m4v
      - .mpg
      - .mpeg
      - .3gp
      - .ogv
      - .ts
      - .vob

  movies:
    description: "Common movie formats (MP4, MKV, AVI)"
    extensions:
      - .mp4
      - .mkv
      - .avi
      - .mov

  # ========================================================================
  # AUDIO / MUSIC
  # ========================================================================
  audio:
    description: "All audio file types"
    extensions:
      - .mp3
      - .wav
      - .flac
      - .aac
      - .m4a
      - .ogg
      - .wma
      - .alac
      - .aiff
      - .ape
      - .opus

  music:
    description: "Common music formats (MP3, FLAC, M4A)"
    extensions:
      - .mp3
      - .flac
      - .m4a
      - .aac

  # ========================================================================
  # DOCS (Top-level - all document types)
  # ========================================================================
  docs:
    description: "All document types (Word, PowerPoint, Excel, PDF)"
    includes_groups:
      - word_docs
      - presentations
      - spreadsheets
      - pdfs
      - text_files

  # ========================================================================
  # OFFICE DOCUMENTS
  # ========================================================================
  word_docs:
    description: "Word documents and text processors"
    extensions:
      - .doc
      - .docx
      - .docm
      - .rtf
      - .odt
      - .pages

  presentations:
    description: "PowerPoint and presentation files"
    extensions:
      - .ppt
      - .pptx
      - .pptm
      - .key
      - .odp

  spreadsheets:
    description: "Excel and spreadsheet files"
    extensions:
      - .xls
      - .xlsx
      - .xlsm
      - .csv
      - .ods
      - .numbers

  pdfs:
    description: "PDF documents"
    extensions:
      - .pdf

  text_files:
    description: "Plain text and markdown files"
    extensions:
      - .txt
      - .md
      - .markdown
      - .rst
      - .log

  # ========================================================================
  # CODE
  # ========================================================================
  code:
    description: "Source code and scripts"
    extensions:
      - .py
      - .java
      - .cpp
      - .c
      - .h
      - .hpp
      - .js
      - .ts
      - .jsx
      - .tsx
      - .html
      - .css
      - .scss
      - .sass
      - .php
      - .rb
      - .go
      - .rs
      - .swift
      - .m
      - .sh
      - .bash
      - .zsh
      - .sql
      - .r
      - .matlab
      - .scala
      - .kt
      - .cs
      - .vb
      - .pl
      - .lua

  python:
    description: "Python files"
    extensions:
      - .py
      - .pyw
      - .ipynb

  web:
    description: "Web development files"
    extensions:
      - .html
      - .css
      - .js
      - .jsx
      - .ts
      - .tsx
      - .php
      - .scss
      - .sass

  # ========================================================================
  # ARCHIVES
  # ========================================================================
  archives:
    description: "Archive and compressed files"
    extensions:
      - .zip
      - .tar
      - .gz
      - .rar
      - .7z
      - .bz2
      - .xz
      - .tgz
      - .tbz2
      - .iso
      - .dmg

  # ========================================================================
  # INSTALLERS
  # ========================================================================
  installers:
    description: "Application installers and packages"
    extensions:
      - .exe
      - .msi
      - .dmg
      - .pkg
      - .deb
      - .rpm
      - .app
      - .apk

  # ========================================================================
  # EVERYTHING
  # ========================================================================
  all:
    description: "All file types (no filtering)"
    extensions: []  # Empty = no filtering

# ============================================================================
# Usage Examples:
# ============================================================================
#
# Scan only images:
#   python main.py /path --file-types images
#
# Scan all media:
#   python main.py /path --file-types media
#
# Scan only Word documents:
#   python main.py /path --file-types word_docs
#
# Scan all document types:
#   python main.py /path --file-types docs
#
# Scan multiple types (comma-separated):
#   python main.py /path --file-types images,videos
#
# Scan everything (default - no filtering):
#   python main.py /path
#
# ============================================================================
