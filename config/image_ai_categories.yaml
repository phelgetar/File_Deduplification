# ============================================================================
# Image AI Content Analysis - Category Configuration
# ============================================================================
# Version: 1.0.0
# Created: 2025-11-15
#
# This file defines categories for AI-based image content analysis.
# The CLIP model will check each image against these categories and
# auto-generate keywords based on what it finds.
#
# HOW IT WORKS:
# - Each category has a list of text descriptions
# - CLIP AI model scores each image against these descriptions
# - If confidence is above threshold, keyword is added
# - Keywords are stored in image_keywords table
#
# CUSTOMIZATION:
# - Add your own categories and descriptions
# - Be specific for better accuracy (e.g., "military uniform" vs "uniform")
# - You can add unlimited categories
# ============================================================================

# Minimum confidence threshold (0.0 to 1.0)
# Default: 0.20 (20% confidence) - adjusted for better detection
# Lower = more tags (may include false positives)
# Higher = fewer tags (only very confident matches)
confidence_threshold: 0.20

# Categories to analyze
categories:

  # ========================================================================
  # MILITARY
  # ========================================================================
  military:
    enabled: true
    descriptions:
      - "military uniform"
      - "military personnel"
      - "soldiers"
      - "military vehicle"
      - "military equipment"
      - "military base"
      - "combat gear"
      - "tactical equipment"
      - "military ceremony"
      - "military training"
    keywords:  # Keywords to add if any description matches
      - "military"

  # ========================================================================
  # VEHICLES
  # ========================================================================
  trucks:
    enabled: true
    descriptions:
      - "truck"
      - "pickup truck"
      - "semi truck"
      - "delivery truck"
      - "tow truck"
      - "dump truck"
      - "fire truck"
    keywords:
      - "truck"

  motorcycles:
    enabled: true
    descriptions:
      - "motorcycle"
      - "motorbike"
      - "dirt bike"
      - "cruiser motorcycle"
      - "sport bike"
      - "Harley Davidson"
    keywords:
      - "motorcycle"

  cars:
    enabled: true
    descriptions:
      - "car"
      - "sedan"
      - "SUV"
      - "sports car"
      - "convertible"
      - "station wagon"
    keywords:
      - "car"

  aircraft:
    enabled: true
    descriptions:
      - "airplane"
      - "aircraft"
      - "helicopter"
      - "military aircraft"
      - "fighter jet"
      - "cargo plane"
      - "passenger plane"
