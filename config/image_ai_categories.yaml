# ============================================================================
# USAGE NOTES
# ============================================================================
#
# To add a new category:
# 1. Add a new section with a unique name
# 2. Set enabled: true
# 3. Add descriptions (what CLIP should look for)
# 4. Add keywords (what to tag the image with)
#
# Example:
#   pets:
#     enabled: true
#     descriptions:
#       - "dog"
#       - "cat"
#       - "pet"
#     keywords:
#       - "pets"
#
# To disable a category temporarily:
#   enabled: false
#
# To adjust sensitivity:
#   - Lower confidence_threshold = more tags (0.15-0.20)
#   - Higher confidence_threshold = fewer tags (0.30-0.40)
#
# ============================================================================
