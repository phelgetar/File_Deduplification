      - "aircraft"

  # ========================================================================
  # LOCATIONS - TERRAIN/LANDSCAPE
  # ========================================================================
  desert:
    enabled: true
    descriptions:
      - "desert"
      - "desert landscape"
      - "sand dunes"
      - "arid landscape"
      - "sandy terrain"
    keywords:
      - "desert"

  urban:
    enabled: true
    descriptions:
      - "city"
      - "urban"
      - "cityscape"
      - "downtown"
      - "buildings"
      - "skyscrapers"
      - "street scene"
    keywords:
      - "urban"

  forest:
    enabled: true
    descriptions:
      - "forest"
      - "woods"
      - "trees"
      - "woodland"
    keywords:
      - "forest"

  mountains:
    enabled: true
    descriptions:
