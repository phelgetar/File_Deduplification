# ============================================================================
# Project Roots — trees that stay intact
# ============================================================================
#
# A project is not a category. A folder under PycharmProjects holds source,
# a README, design PDFs, a Word spec and screenshots, and every one of them
# only means something in place. Filing them by type scatters one working
# thing across Code/, Docs/PDF/, Docs/Word/ and Media/Images/, and nothing
# puts it back together.
#
# So these rules outrank everything else in the organizer, including
# semantic contexts: the whole subtree is copied verbatim under the
# project's own name.
#
# Disable entirely with WORKBENCH_NO_PROJECT_ROOTS=1.
# ============================================================================

enabled: true

# ----------------------------------------------------------------------------
# Containers: directories whose IMMEDIATE CHILDREN are each one project.
#
# The container itself is not the unit — otherwise every project you own
# would land in a single folder. PycharmProjects/File_Deduplification and
# PycharmProjects/doc-classifier stay separate, each complete.
#
# Containers win over markers, so a repository nested inside a project does
# not carve out a smaller root than you intended.
# ----------------------------------------------------------------------------
containers:
  - path: "/Users/canadytw/PycharmProjects"
    destination: "Projects"
    description: "Python/IDE projects — code, docs, notes and assets together"

  # Websites and applications belong here too. Add your own, e.g.:
  # - path: "/Volumes/home/Sites"
  #   destination: "Websites"
  # - path: "/Users/canadytw/Developer"
  #   destination: "Projects"

# ----------------------------------------------------------------------------
# Markers: any directory containing one of these IS a project root, wherever
# it happens to live. Matched against filenames in the directory itself, not
# against the path string — a file inside .git/ is not the same thing as a
# directory that HAS a .git.
#
# Entries beginning with a dot also match by suffix, so ".xcodeproj" catches
# "MyApp.xcodeproj".
# ----------------------------------------------------------------------------
marker_destination: "Projects"

markers:
  # Version control
  - .git
  - .hg
  - .svn
  # Language and build tooling
  - package.json
  - pyproject.toml
  - setup.py
  - requirements.txt
  - Cargo.toml
  - go.mod
  - pom.xml
  - build.gradle
  - build.gradle.kts
  - Gemfile
  - composer.json
  - CMakeLists.txt
  - Makefile
  - tsconfig.json
  - mix.exs
  - build.sbt
  - Package.swift
  # Apple project bundles (suffix match)
  - .xcodeproj
  - .xcworkspace

# NOTE: index.html is deliberately NOT a marker. A stray index.html saved
# into Downloads would make every file below it one "project". Point a
# container at your web root instead — that says which trees are sites.

# ----------------------------------------------------------------------------
# Never a project root, no matter what markers it contains. Your home
# directory is always included; add share roots and scan sources here.
# ----------------------------------------------------------------------------
never_roots:
  - "/Volumes/home"
  - "/Volumes/homes"
  - "/Users/canadytw/Documents"
  - "/Users/canadytw/Downloads"
  - "/Users/canadytw/Desktop"
