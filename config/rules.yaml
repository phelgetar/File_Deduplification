# ============================================================================
# Rules — one table for what a file IS and where it GOES
# ============================================================================
#
# This file replaces four that each held a slice of the same knowledge:
# the classifier's hardcoded extension lists, CATEGORY_FOLDER_MAP, the
# --file-types groups, and project_roots.yaml. They drifted, because
# nothing made them agree: .py was "code" to the filter and "document" to
# the classifier, .rw2 was a photograph to one and a Quicken file to the
# other, and macro-enabled Office documents were simply unrecognised.
#
# One extension appears exactly once here. Add a format by adding it to
# the category it belongs to; the filter groups, the folder layout and the
# classifier all follow from that automatically.
#
# What is NOT here, on purpose:
#   config/semantic_paths.yaml     where a file came from (Work, Education,
#                                  Personal - Disability/VA) — a different
#                                  question from what it is
#   config/image_ai_categories.yaml  what a photograph depicts, for the
#                                  vision model
#
# Version: 1.0.0
# Created: 2026-08-20
# ============================================================================

version: 1

# ----------------------------------------------------------------------------
# CATEGORIES
#
# folder      where files of this category are filed, under --base-dir
# extensions  every extension that means this category, and only this one
# ----------------------------------------------------------------------------
categories:

  image:
    folder: "Media/Images"
    description: "Photographs, graphics and raw camera files"
    extensions: [".ai", ".arw", ".bmp", ".cdr", ".cr2", ".djvu", ".dng", ".eps", ".gif", ".heic",
      ".heif", ".ico", ".indd", ".jpeg", ".jpg", ".nef", ".orf", ".png", ".psd", ".raw",
      ".rw2", ".svg", ".tif", ".tiff", ".webp"]

  video:
    folder: "Media/Videos"
    description: "Video of every container and codec"
    extensions: [".3gp", ".avi", ".flv", ".m2ts", ".m4v", ".mkv", ".mov", ".mp4", ".mpeg", ".mpg",
      ".mts", ".ogv", ".ts", ".vob", ".webm", ".wmv"]

  audio:
    folder: "Media/Music"
    description: "Music and other audio"
    extensions: [".aac", ".aiff", ".alac", ".ape", ".flac", ".m4a", ".mid", ".midi", ".mp3", ".ogg",
      ".opus", ".wav", ".wma"]

  document:
    folder: "Docs"
    description: "Documents whose specific kind is not known"
    extensions: []   # assigned by path or filename rules, not by extension

  document_word:
    folder: "Docs/Word"
    description: "Word processor documents"
    extensions: [".doc", ".docm", ".docx", ".odt", ".pages", ".rtf", ".wpd"]

  document_pdf:
    folder: "Docs/PDF"
    description: "PDF, PostScript and ebooks"
    extensions: [".azw", ".azw3", ".epub", ".mobi", ".pdf", ".ps"]

  document_text:
    folder: "Docs/Text"
    description: "Plain text, Markdown and logs"
    extensions: [".log", ".md", ".nfo", ".readme", ".rst", ".tex", ".txt"]

  spreadsheet:
    folder: "Docs/Spreadsheets"
    description: "Spreadsheets and delimited tables"
    extensions: [".csv", ".ods", ".tsv", ".xls", ".xlsm", ".xlsx"]

  presentation:
    folder: "Docs/PowerPoints"
    description: "Slide decks"
    extensions: [".key", ".odp", ".ppt", ".pptm", ".pptx"]

  code:
    folder: "Code"
    description: "Source code, scripts and build output"
    extensions: [".a", ".asd", ".asm", ".bash", ".c", ".cl", ".class", ".clj", ".cmd", ".coffee", ".cpp",
      ".cs", ".dart", ".ear", ".el", ".erl", ".ex", ".f", ".f90", ".fasl", ".go", ".groovy",
      ".h", ".hpp", ".hs", ".ipynb", ".jar", ".java", ".jl", ".jsx", ".kt", ".less", ".lib",
      ".lisp", ".lsp", ".lua", ".m", ".matlab", ".ml", ".nim", ".o", ".obj", ".php", ".pl",
      ".pro", ".prolog", ".ps1", ".psm1", ".py", ".pyc", ".pyd", ".pyo", ".pyw", ".r", ".rb",
      ".rs", ".s", ".sass", ".scala", ".scm", ".scpt", ".scss", ".sh", ".sql", ".swift",
      ".tsx", ".vb", ".vue", ".war", ".zsh"]

  web:
    folder: "Web"
    description: "Web pages, stylesheets and browser scripts"
    extensions: [".css", ".htm", ".html", ".js"]

  data:
    folder: "Data"
    description: "Structured data, databases and configuration"
    extensions: [".accdb", ".cfg", ".conf", ".config", ".dat", ".data", ".db", ".emlx", ".ichat", ".ini",
      ".json", ".mdb", ".prefs", ".sqlite", ".toml", ".xml", ".yaml", ".yml"]

  archive:
    folder: "Archives"
    description: "Compressed archives and disk images"
    extensions: [".7z", ".ace", ".arj", ".bz2", ".cab", ".cpio", ".gz", ".img", ".iso", ".lz", ".lzma",
      ".mdf", ".mds", ".mdzip", ".nrg", ".ova", ".ovf", ".qcow2", ".rar", ".sitx", ".tar",
      ".tbz2", ".tgz", ".toast", ".vdi", ".vhd", ".vmdk", ".xz", ".zip"]

  installer:
    folder: "Installers"
    description: "Installers, packages and executables"
    extensions: [".apk", ".app", ".appx", ".bat", ".bin", ".deb", ".dll", ".dmg", ".dylib", ".elf",
      ".exe", ".ipa", ".mpkg", ".msi", ".msix", ".msu", ".out", ".pkg", ".rpm", ".run",
      ".snap", ".so"]

  application:
    folder: "Applications"
    description: "Installed applications (structure preserved)"
    extensions: []   # assigned by path or filename rules, not by extension

  font:
    folder: "Fonts"
    description: "Typefaces"
    extensions: [".dfont", ".eot", ".fon", ".otf", ".ttf", ".woff", ".woff2"]

  certificate:
    folder: "Certs"
    description: "Keys, certificates and signing requests"
    extensions: [".cer", ".crt", ".csr", ".der", ".p12", ".p7b", ".p7c", ".pem", ".pfx", ".pub", ".spc",
      ".wzd"]

  scientific:
    folder: "Scientific"
    description: "Scientific and numerical data sets"
    extensions: [".dcm", ".dicom", ".dta", ".fig", ".fits", ".h5", ".hdf5", ".mat", ".nc", ".npy",
      ".npz", ".pickle", ".pkl", ".rdata", ".rds", ".sav"]

  financial:
    folder: "Financial"
    description: "Quicken, TurboTax, TaxAct and H&R Block files"
    extensions: [".h2", ".h23", ".h24", ".h25", ".h26", ".q2", ".qdf", ".qel", ".qfx", ".qif", ".qmtf",
      ".qnx", ".qpb", ".qph", ".qsd", ".qxf", ".t2", ".t23", ".t24", ".t25", ".t26", ".tax",
      ".txf"]

  education:
    folder: "Education"
    description: "Course materials identified by filename"
    extensions: []   # assigned by path or filename rules, not by extension

  backup:
    folder: "Backups"
    description: "Backup copies (structure preserved)"
    extensions: [".backup", ".bak", ".old", ".orig", ".save", ".swp"]

  temporary:
    folder: "Temp"
    description: "Caches and partial downloads"
    extensions: [".cache", ".part", ".temp", ".tmp"]

  system:
    folder: "System"
    description: "System and interface-builder files"
    extensions: [".bundle", ".car", ".log2", ".nib", ".plist", ".tbd", ".xib"]

  shortcut:
    folder: "Shortcuts"
    description: "Aliases, links and shortcuts"
    extensions: [".alias", ".lnk", ".rdp", ".url", ".vncloc", ".webloc"]

  security_camera_video:
    folder: "Media/Videos/SecurityCameraVideos"
    description: "Security camera footage (by directory name)"
    extensions: []   # assigned by path or filename rules, not by extension

  wolf_video:
    folder: "Media/Videos/WolfVids"
    description: "Wolf videos (by directory name)"
    extensions: []   # assigned by path or filename rules, not by extension

  other:
    folder: "Other"
    description: "Recognised but uncategorised"
    extensions: []   # assigned by path or filename rules, not by extension

  unknown:
    folder: "Unclassified"
    description: "Not recognised"
    extensions: []   # assigned by path or filename rules, not by extension

# ----------------------------------------------------------------------------
# FILTER GROUPS — the names --file-types accepts
#
# Unions name categories, so they can never fall out of step with them.
# Subsets are narrower than any one category ("photos" is not "image":
# it excludes icons, screenshots and vector art) and so list extensions.
# ----------------------------------------------------------------------------
filter_groups:
  media:
    categories: [image, video, audio]
  docs:
    categories: [document, document_word, document_pdf, document_text, spreadsheet, presentation]
  images:
    categories: [image]
  videos:
    categories: [video]
  word_docs:
    categories: [document_word]
  pdfs:
    categories: [document_pdf]
  spreadsheets:
    categories: [spreadsheet]
  presentations:
    categories: [presentation]
  archives:
    categories: [archive]
  executables:
    categories: [installer]
  installers:
    categories: [installer]
  fonts:
    categories: [font]

  # Narrower than a category — these must list their own extensions.
  photos:
    description: "Camera photographs only, no graphics or icons"
    extensions: ['.jpg', '.jpeg', '.heic', '.heif', '.png', '.tiff', '.tif', '.dng', '.cr2', '.nef', '.raw', '.arw', '.orf', '.rw2']
  raw_images:
    description: "Raw camera formats only"
    extensions: ['.raw', '.cr2', '.nef', '.dng', '.arw', '.orf', '.rw2']
  movies:
    description: "Feature-length video containers"
    extensions: ['.mp4', '.mkv', '.avi', '.mov', '.m4v', '.webm', '.mpg', '.mpeg']
  music:
    description: "Music formats only, not voice memos or MIDI"
    extensions: ['.mp3', '.flac', '.m4a', '.aac', '.ogg', '.wav', '.alac', '.ape', '.wma', '.opus']


# ============================================================================
# PROJECT ROOTS — trees that stay intact
# ============================================================================
#
# A project is not a category. A folder under PycharmProjects holds source,
# a README, design PDFs, a Word spec and screenshots, and every one of them
# only means something in place. Filing them by type scatters one working
# thing across Code/, Docs/PDF/, Docs/Word/ and Media/Images/, and nothing
# puts it back together.
#
# So these rules outrank the categories above, and outrank
# config/semantic_paths.yaml: the whole subtree is copied verbatim under
# the project's own name, whatever it contains.
#
# Disable entirely with WORKBENCH_NO_PROJECT_ROOTS=1.
# ============================================================================

project_roots:

  enabled: true

  # ----------------------------------------------------------------------------
  # Containers: directories whose IMMEDIATE CHILDREN are each one project.
  #
  # The container itself is not the unit — otherwise every project you own
  # would land in a single folder. PycharmProjects/File_Deduplification and
  # PycharmProjects/doc-classifier stay separate, each complete.
  #
  # Containers win over markers, so a repository nested inside a project does
  # not carve out a smaller root than you intended.
  # ----------------------------------------------------------------------------
  containers:
    - path: "/Users/canadytw/PycharmProjects"
      destination: "Projects"
      description: "Python/IDE projects — code, docs, notes and assets together"

    # Websites and applications belong here too. Add your own, e.g.:
    # - path: "/Volumes/home/Sites"
    #   destination: "Websites"
    # - path: "/Users/canadytw/Developer"
    #   destination: "Projects"

  # ----------------------------------------------------------------------------
  # Markers: any directory containing one of these IS a project root, wherever
  # it happens to live. Matched against filenames in the directory itself, not
  # against the path string — a file inside .git/ is not the same thing as a
  # directory that HAS a .git.
  #
  # Entries beginning with a dot also match by suffix, so ".xcodeproj" catches
  # "MyApp.xcodeproj".
  # ----------------------------------------------------------------------------
  marker_destination: "Projects"

  markers:
    # Version control
    - .git
    - .hg
    - .svn
    # Language and build tooling
    - package.json
    - pyproject.toml
    - setup.py
    - requirements.txt
    - Cargo.toml
    - go.mod
    - pom.xml
    - build.gradle
    - build.gradle.kts
    - Gemfile
    - composer.json
    - CMakeLists.txt
    - Makefile
    - tsconfig.json
    - mix.exs
    - build.sbt
    - Package.swift
    # Apple project bundles (suffix match)
    - .xcodeproj
    - .xcworkspace

  # NOTE: index.html is deliberately NOT a marker. A stray index.html saved
  # into Downloads would make every file below it one "project". Point a
  # container at your web root instead — that says which trees are sites.

  # ----------------------------------------------------------------------------
  # Never a project root, no matter what markers it contains. Your home
  # directory is always included; add share roots and scan sources here.
  # ----------------------------------------------------------------------------
  never_roots:
    - "/Volumes/home"
    - "/Volumes/homes"
    - "/Users/canadytw/Documents"
    - "/Users/canadytw/Downloads"
    - "/Users/canadytw/Desktop"
